<!doctype html>
<html lang="pt-BR" data-v="creme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Júnia Alves · Psicóloga</title>
<meta name="theme-color" content="#F3ECE4">
<script>
// tema: ?v= no link > escolha salva > creme. Roda antes de pintar a página, para não piscar a cor errada.
// ?static congela tudo no estado final (usado para gerar o PDF e para os testes visuais).
(function(){var q=new URLSearchParams(location.search),v=q.get('v'),s=null;
try{s=localStorage.getItem('ja-tema')}catch(e){}
if(v!=='bordo'&&v!=='creme')v=s==='bordo'?'bordo':'creme';
document.documentElement.dataset.v=v;
document.querySelector('meta[name=theme-color]').content=v==='bordo'?'#4A0B0D':'#F3ECE4';
if(q.has('static'))document.documentElement.classList.add('static');
// com animação, o topo espera o JavaScript montar a entrada (no máximo 3 s) para não aparecer pronto e "pular"
else if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('anim');setTimeout(function(){document.documentElement.classList.add('ready')},3000)}})();
</script>
<style>html.anim:not(.ready) .hero .in,html.anim:not(.ready) .nav .row{visibility:hidden}</style>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Psicoterapia para adultos, online e presencial. Júnia Alves, psicóloga clínica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap">
</head>

</body>
</html>
